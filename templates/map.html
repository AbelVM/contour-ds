<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contour · Map demo</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="../src/css/ds.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="../src/css/map-chrome.css" />
    <script>
      try {
        document
          .querySelector('meta[name="color-scheme"]')
          .content = localStorage.getItem("contour-scheme") ?? "light dark";
      } catch (e) {
        /* storage blocked */
      }
    </script>
    <style>
      .map-shell { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
      .map-canvas { position: relative; }
      .map-panel { overflow: auto; border-inline-start: 1px solid var(--color-border); background: var(--color-surface); display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-md); }
    </style>
  </head>
  <body>
    <div class="map-shell">
      <div class="map-canvas">
        <contour-map-area id="map" attribution="© OpenStreetMap" controls='[{"label":"+"},{"label":"−"}]' style="position: absolute; inset: 0;"></contour-map-area>
      </div>
      <aside class="map-panel">
      <div class="c-section-head">
        <div>
          <span class="label">Layers</span>
          <h2 class="c-section-head__title">Contour chrome</h2>
        </div>
        <button class="c-btn c-btn--icon c-btn--secondary c-scheme-toggle" type="button" data-scheme-toggle aria-label="Switch to dark theme" style="margin-inline-start: auto;">
          <span class="c-scheme-toggle__icons" aria-hidden="true">
            <svg class="c-scheme-toggle__sun"><use href="#i-sun" /></svg>
            <svg class="c-scheme-toggle__moon"><use href="#i-moon" /></svg>
          </span>
        </button>
      </div>
        <contour-layer-panel label="Layers" items='[{"name":"Routing graph","visible":true,"opacity":100},{"name":"Catchment","visible":false,"opacity":60},{"name":"Isochrones","visible":true,"opacity":80}]'></contour-layer-panel>
        <div class="c-kpi">
          <div class="c-kpi__value">12</div>
          <div class="c-kpi__label">Active layers</div>
        </div>
        <div class="c-kpi">
          <div class="c-kpi__value">3.4 km</div>
          <div class="c-kpi__label">Route length</div>
        </div>
        <contour-compass needle="42"></contour-compass>
        <contour-scale-bar label="Scale" value="4rem"></contour-scale-bar>
        <contour-readout></contour-readout>
      <div class="c-stack">
        <button class="c-btn c-btn--primary c-btn--block" type="button">Compute route</button>
        <button class="c-btn c-btn--ghost c-btn--block" type="button">Export GeoJSON</button>
      </div>
      </aside>
    </div>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <defs>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" />
          </g>
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>
    <script src="../src/js/ds.js" defer></script>
    <script type="module" src="../src/js/wc/index.mjs"></script>
<script type="module">
      import { Map, NavigationControl, Popup } from "https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs";
      const area = document.getElementById("map");
      const map = new Map({
        container: area,
        style: "https://demotiles.maplibre.org/style.json",
        center: [13.4, 52.5],
        zoom: 0,
      });
      area.attachMap(map);
      map.addControl(new NavigationControl(), "top-right");

      // Hover popup to verify Contour chrome on popups. Content uses the
      // feature under the cursor when one is present, otherwise coordinates.
      const popup = new Popup({ closeButton: true, closeOnClick: false, offset: 12, anchor: "bottom" });
      map.on("mousemove", (e) => {
        const features = map.queryRenderedFeatures(e.point);
        if (!features || !features.length) { popup.remove(); return; }
        const f = features[0];
        const props = (f && f.properties) ? f.properties : {};
        const name = props.name || props.NAME || props.title || "Feature";
        const html = "<strong>" + name + "</strong><br/>" +
          Object.keys(props).slice(0, 4).map((k) => k + ": " + props[k]).join("<br/>");
        if (!popup.isOpen()) popup.addTo(map);
        popup.setLngLat(e.lngLat).setHTML(html);
      });
      map.on("mouseout", () => popup.remove());
    </script>
  </body>
</html>
