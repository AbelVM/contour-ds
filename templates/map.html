<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contour · Map demo</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="../src/css/ds.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="../src/css/map-chrome.css" />
    <script>
      try {
        document
          .querySelector('meta[name="color-scheme"]')
          .content = localStorage.getItem("contour-scheme") ?? "light dark";
      } catch (e) {
        /* storage blocked */
      }
    </script>
    <style>
      .map-shell { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
      .map-canvas { position: relative; }
      .map-panel { overflow: auto; border-inline-start: 1px solid var(--color-border); background: var(--color-surface); display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-md); }
    </style>
  </head>
  <body>
    <div class="map-shell">
      <div class="map-canvas">
        <contour-map-area id="map" attribution="© OpenStreetMap" controls='[{"label":"+"},{"label":"−"}]' style="position: absolute; inset: 0;"></contour-map-area>
      </div>
      <aside class="map-panel">
        <div class="c-section-head">
          <div>
            <span class="label">Layers</span>
            <h2 class="c-section-head__title">Contour chrome</h2>
          </div>
        </div>
        <contour-layer-panel label="Layers" items='[{"name":"Routing graph","visible":true,"opacity":100},{"name":"Catchment","visible":false,"opacity":60},{"name":"Isochrones","visible":true,"opacity":80}]'></contour-layer-panel>
        <div class="c-kpi">
          <div class="c-kpi__value">12</div>
          <div class="c-kpi__label">Active layers</div>
        </div>
        <div class="c-kpi">
          <div class="c-kpi__value">3.4 km</div>
          <div class="c-kpi__label">Route length</div>
        </div>
        <contour-compass needle="42"></contour-compass>
        <contour-scale-bar label="Scale" value="4rem"></contour-scale-bar>
        <contour-readout></contour-readout>
        <div class="c-stack">
          <button class="c-btn c-btn--primary c-btn--block" type="button">Compute route</button>
          <button class="c-btn c-btn--ghost c-btn--block" type="button">Export GeoJSON</button>
        </div>
      </aside>
    </div>
    <script src="../src/js/ds.js" defer></script>
    <script type="module" src="../src/js/wc/index.mjs"></script>
<script type="module">
      import { Map, NavigationControl } from "https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.mjs";
      const area = document.getElementById("map");
      const map = new Map({
        container: area,
        style: "https://demotiles.maplibre.org/style.json",
        center: [13.4, 52.5],
        zoom: 0,
      });
      area.attachMap(map);
      map.addControl(new NavigationControl(), "top-right");
    </script>
  </body>
</html>
