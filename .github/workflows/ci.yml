name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate markup
        run: npx html-validate index.html templates/*.html
      - name: Check script syntax
        run: node --check src/js/ds.js assets/js/guide.js
      - name: Check token census
        run: node tools/check-tokens.mjs
      - name: Check snippets idempotency
        run: |
          cp index.html /tmp/index-before.html
          node tools/snippets.mjs
          diff /tmp/index-before.html index.html
      - name: Build
        run: node tools/build.mjs
      - name: Check token export
        run: |
          python3 -c "
          import json
          d = json.load(open('dist/contour.tokens.json'))
          assert len(d) >= 200, f'Expected 200+ tokens, got {len(d)}'
          print(f'Token export: {len(d)} entries OK')
          "
