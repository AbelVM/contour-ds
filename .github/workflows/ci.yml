name: CI

# Every gate the review puts in this milestone (T-23): the markup, the scripts,
# the token census, the size budget, the published numbers, the snippets fixed
# point, the browser-measured contrast contract and the token export.
#
# Ordering is load-bearing. The build runs BEFORE the size budget, because a
# failed build leaves the previous dist/ in place and the budget would then
# certify bytes that were never produced from the current src/. check-size also
# refuses a stale dist/ on its own, so the two protections are independent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate markup
        run: npx html-validate index.html templates/*.html

      # node --check takes ONE file: `node --check a b` checks a and silently
      # ignores b, so every script needs its own invocation. Verified with a
      # probe: a broken second argument exits 0.
      - name: Check script syntax
        run: |
          node --check src/js/ds.js
          node --check assets/js/guide.js
          find tools -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Check python tooling compiles
        run: python3 -m py_compile tools/contour-gen.py

      - name: Check token census
        run: node tools/check-tokens.mjs

      # The census says every declared token is read somewhere; this says the
      # opposite half of the same rule — that a colour or duration in src/ is a
      # token read rather than a hard-coded literal. It is the enforcement behind
      # 'no raw hex in a component', so the rule cannot be published as prose
      # before the gate that owns it actually runs in a lane.
      - name: Check the token family gate (no raw literals)
        run: node tools/audit/family-gate.mjs

      # WCAG 2.2.2 is Level A: every infinite animation must be pausable by a
      # control that ships on a page, not only by an operating-system setting.
      - name: Check the motion contract
        run: node tools/check-motion.mjs

      - name: Build
        run: node tools/build.mjs

      - name: Check size budget and that dist is current
        run: node tools/check-size.mjs

      - name: Check the shipped bundle loads cleanly
        run: node tools/check-dist.mjs

      - name: Check guide-only identifiers have not leaked into src/
        run: node tools/check-ownership.mjs

      # Layout primitives are a ratchet: a fourth vocabulary cannot appear
      # silently, and a @deprecated note must match the gate's ledger.
      - name: Check the layout vocabulary and its deprecation ledger
        run: node tools/check-layout.mjs

      # A url(#id) in src/css is a promise some document defines that id. This
      # checks the promise is kept inside src/, not only inside the style guide.
      - name: Check every url(#id) reference reaches a def in src/
        run: node tools/check-defs.mjs

      - name: Check the token export covers the whole token layer
        run: node tools/check-export.mjs

      # The component contract is generated, so it can be stale, hand-edited or
      # invented. This gate reads the shipped file and holds every name in it
      # against src/css: blocks the inventory sees, elements/variants that fold
      # back to their block, states that appear in a real selector, and the split
      # between declared tokens and host inputs the system only reads.
      - name: Check the component contract resolves against src/css
        run: node tools/check-components.mjs

      # The docs package is generated from index.html, so it can be hand-edited,
      # stale or invented. This gate reads dist/docs/ and re-derives every shipped
      # byte from the current guide: a sentence the guide never says, a block the
      # component contract does not define, a summary count that disagrees with the
      # array beside it, or a URL inside a private project's installed package all
      # land here. It prints what it compared, because a scan that silently matched
      # nothing would otherwise report a clean package forever.
      - name: Check the docs package is the guide's own prose and nothing else
        run: node tools/check-docs.mjs

      # The registry is generated from the built package, so it can go stale, point at
      # a file that no longer exists, or quietly switch from pointers to inlined CSS —
      # which would duplicate four stylesheets inside dist/. This gate reads
      # dist/registry/ and checks resolution, the pointer shape, the honesty rules (no
      # homepage, no url: the project is private until v1.0 and the deployment 404s),
      # each item's published counts against the inventory, and that the core layer is
      # really inside every surface bundle — which is why registryDependencies is empty.
      # It claims structure only; conformance to the schema is the contract lane's job.
      - name: Check the registry points at files that exist and says nothing untrue
        run: node tools/check-registry.mjs

      # The light-dark() fallback is generated from the token layer; a committed
      # copy that no longer matches src/css is a fallback that lies about the
      # system, so the regeneration is checked, not trusted.
      - name: Check the light-dark() fallback is current against src/css
        run: node tools/gen-light-dark.mjs --check

      - name: Check published numbers match the source
        run: node tools/stamp.mjs --check

      # A published sentence with no owning check is the failure this lane
      # exists to end: every gate can be green while a document still claims
      # something nothing measures.
      - name: Check every published claim names the gate that owns it
        run: node tools/check-claims.mjs

      # Missing preconnect hints and absent social metadata cost the reader and
      # the share card, and change no other test result — so this is the only
      # place either is checked.
      - name: Check markup hygiene (font preconnects, share metadata)
        run: node tools/check-markup.mjs

      - name: Check snippets idempotency
        run: |
          cp index.html /tmp/index-before.html
          node tools/snippets.mjs
          diff /tmp/index-before.html index.html

  # The browser gates are a separate job so a missing driver cannot take the
  # static checks down with it, and so the install cost is visible on its own.
  # The harnesses refuse to run — rather than skip — when no browser is found.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the audit harnesses' dev dependency
        run: npm --prefix tools/audit install
      - name: Install chromium
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      # dist/ is gitignored, so a job that reads the shipped artifacts has to
      # build them. The build runs first on purpose: a failed build leaves the
      # previous dist/ in place, and a lane after it would then certify bytes
      # that were never produced from the current src/.
      - name: Build the artifacts the token contract reads
        run: node tools/build.mjs
      # Every other token gate counts declarations. This one asks an independent
      # implementation of DTCG 2025.10 whether the shipped documents conform, and
      # confirms each published colour against the declaration it came from.
      # It exits rather than skipping when dembrandt is not installed.
      - name: DTCG 2025.10 conformance of the shipped token export
        run: node tools/audit/dtcg-contract.mjs
      # ajv, not this repository, answers whether dist/registry/ conforms to the live
      # shadcn schemas — the same shape as the dembrandt gate above. The schemas are
      # vendored under tools/audit/schema/ with their hashes in sources.json, so the
      # check is deterministic and needs no network; the gate first proves its own
      # validator still rejects non-conformant documents before reporting a pass, and
      # exits rather than skipping when ajv is absent.
      - name: Registry conformance against the vendored shadcn schemas
        run: node tools/audit/registry-contract.mjs
      - name: Contrast, focus, chart, palette and document contract
        run: node tools/audit/contrast-and-aria.mjs
      - name: Component inventory and target sizes
        run: node tools/audit/component-inventory.mjs
      # The gridline band is a construction, not a string: this gate re-points
      # --chart-ticks and requires the rendered band to follow it.
      - name: Chart geometry seam (derived band, tooltip, hover state)
        run: node tools/audit/chart-geometry.mjs
      # A chart whose aria-label is the word "Chart" satisfies a grep and tells a
      # blind reader nothing, so this reads the accessibility tree instead.
      - name: Chart accessible names and data alternatives
        run: node tools/audit/chart-names.mjs
      # Every other gate counts declarations. This one asks a browser what a
      # freshly mounted control actually paints after a theme set is selected,
      # and sweeps --brand-hue across both themes.
      - name: Theme render probe
        run: node tools/audit/theme-render-probe.mjs
